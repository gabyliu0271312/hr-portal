<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>绩效填写工作区</title><style>
/* CR-008-T01 v1：固定头部、页签和底栏，中间画布填满剩余空间且独立滚动。 */
:root{color-scheme:light;--bg:#f4f5f6;--surface:#fff;--text:#1f2329;--muted:#646a73;--border:#dee0e3;--accent:#3370ff;--danger:#f54a45;--readonly:#f5f6f7;--font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;--font-title:var(--font-body)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font-body)}button,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.55}.workspace{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.person-header{display:flex;align-items:center;gap:16px;flex:none;min-height:64px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface)}.back{border:0;background:none;color:var(--text);font-size:24px}.avatar{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--readonly);color:var(--muted)}.person{min-width:0}.person strong{font:600 16px/24px var(--font-title)}.person small{display:block;color:var(--muted);font-size:14px}.mode-tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.prototype{font-size:12px;color:var(--muted)}select{max-width:100%;border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--text);background:var(--surface)}.tabs{display:flex;gap:28px;flex:none;min-height:48px;margin:12px 12px 0;padding:0 20px;background:var(--surface);border-radius:8px;overflow-x:auto}.tabs button{white-space:nowrap;position:relative;min-height:48px;border:0;background:none;color:var(--text);padding:0}.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}.tabs button[aria-selected="true"]:after{content:"";height:3px;background:var(--accent);position:absolute;bottom:0;left:0;right:0;border-radius:3px 3px 0 0}.scroll{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column}.canvas{flex:1 0 auto;width:100%;min-width:0;padding:20px 30px 32px;border-radius:8px;background:var(--surface)}h1{font:600 18px/26px var(--font-title);margin:0 0 28px}h2{font:600 16px/24px var(--font-title);margin:0}p{margin:4px 0 20px;color:var(--muted)}.field{margin-top:20px;min-width:0}.field label{display:block;font-weight:600;margin-bottom:8px}.star{color:var(--danger);margin-left:4px}.editor{border:1px solid var(--border);border-radius:6px;overflow:hidden}.toolbar{display:flex;gap:20px;padding:8px 12px;color:var(--muted);font-size:16px;user-select:none}.editor textarea{display:block;resize:vertical;min-height:106px;width:100%;border:0;padding:8px 12px 16px;background:var(--surface);color:var(--text);outline-offset:-2px}.editor textarea::placeholder{color:var(--muted)}.editor.readonly{background:var(--readonly);min-height:108px;padding:12px}.add{border:0;background:none;color:var(--accent);padding:8px 0}.footer{flex:none;display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 20px;background:var(--surface);border-top:1px solid var(--border)}.footer button,.retry{padding:6px 22px;min-height:32px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}.footer .primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}.status{color:var(--muted)}.message{display:grid;place-content:center;min-height:300px;text-align:center}.message h2{margin-bottom:8px}.message .retry{margin-top:16px}.notice{padding:10px 12px;background:var(--readonly);border-radius:6px;margin-bottom:20px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:640px){.person-header{padding-inline:16px;gap:10px;flex-wrap:wrap}.person small{font-size:12px;overflow-wrap:anywhere}.mode-tools{flex-basis:100%;margin:0}.tabs{margin-inline:16px;padding-inline:16px;gap:20px}.scroll{padding:12px 16px}.canvas{padding:20px 16px}.footer{padding-inline:16px;flex-wrap:wrap}.status{font-size:12px}.toolbar{gap:14px}}
</style></head><body><div class="workspace">
<header class="person-header"><button class="back" aria-label="返回（蓝图演示）">←</button><div class="avatar" aria-hidden="true">示</div><div class="person"><strong>示例员工</strong><small>示例部门 · 职级 · 岗位信息（按服务端可见性返回）</small></div><div class="mode-tools"><span class="prototype">CR-008-T01 · v1 待确认蓝图 · 不连接业务 API</span><select id="state" aria-label="预览页面状态"><option value="edit">可编辑</option><option value="long">长表单滚动</option><option value="readonly">整体只读</option><option value="partial">部分只读</option><option value="loading">加载中</option><option value="error">加载失败</option><option value="forbidden">无权访问</option><option value="empty">无填写内容</option><option value="save-error">保存失败</option><option value="submitted">提交反馈示意</option></select></div></header>
<nav class="tabs" aria-label="绩效填写页签"><button id="current-tab" aria-selected="true">填写工作总结</button><button id="reference-tab" aria-selected="false">配置的参考内容</button></nav>
<main class="scroll"><section class="canvas" id="canvas"><div id="form-view"><h1>填写工作总结</h1><div id="readonly-notice" class="notice" hidden>当前任务不可编辑。已提交内容按服务端权限只读展示。</div><h2>工作总结</h2><p>请填写周期内的重点工作有效产出，包含数据、事例、项目进展等。</p><div id="fields"></div><button class="add" id="add">＋ 添加</button></div><div id="reference-view" hidden><h1>配置的参考内容</h1><div class="notice">此处仅展示已配置且当前用户有权查看的来源内容；不会默认增加 OKR 或其他数据接入。</div><h2>来源环节</h2><p>示意：已提交内容通过同一只读 Renderer 展示；不在此修改来源答案。</p></div><div id="state-view" class="message" hidden><h2 id="state-title"></h2><div id="state-description"></div><button class="retry" id="retry" hidden>重新加载（演示）</button></div></section></main>
<footer class="footer" id="footer"><button class="primary" id="submit" disabled>提交（蓝图不可提交）</button><button id="cancel">取消（演示）</button><span class="status" id="save-status" role="status">草稿将实时保存到云端（文案示意，不会真实保存）</span></footer></div>
<script>
const byId=id=>document.getElementById(id);let count=1;let reference=false;
function field(i,read){const row=document.createElement('div');row.className='field';const label=document.createElement('label');label.htmlFor='key-work-'+i;label.textContent='重点工作 '+i;const star=document.createElement('span');star.className='star';star.textContent=read?'':'*';label.append(star);row.append(label);const ed=document.createElement('div');ed.className='editor'+(read?' readonly':'');if(read){ed.textContent='示例已提交内容：完成项目目标及关键产出。只读字段不参与当前任务写入。';}else{const toolbar=document.createElement('div');toolbar.className='toolbar';toolbar.textContent='B　 I　 U　 ≡　 ☷　 ↗';toolbar.setAttribute('aria-label','富文本工具栏，仅外观示意');const input=document.createElement('textarea');input.id='key-work-'+i;input.placeholder='请通过数据、事例和项目进展说明本周期的重点工作产出。此处输入仅用于蓝图演示。';ed.append(toolbar,input);}row.append(ed);return row;}
function render(){const state=byId('state').value;const messages={loading:['正在加载…','保留工作区结构，禁止提交。'],error:['工作总结加载失败','保留返回入口，可以重新加载。'],forbidden:['无法访问该任务','不展示受保护的题目或答案；拒绝语义由服务端决定。'],empty:['暂无填写内容','不生成示例答案，不允许空任务误提交。']};const message=messages[state];byId('form-view').hidden=reference||!!message;byId('reference-view').hidden=!reference;byId('state-view').hidden=reference||!message;byId('footer').hidden=reference;if(message){byId('state-title').textContent=message[0];byId('state-description').textContent=message[1];byId('retry').hidden=state!=='error';}byId('fields').replaceChildren();const n=state==='long'?8:count;for(let i=1;i<=n;i++)byId('fields').append(field(i,state==='readonly'||state==='partial'&&i===1));byId('readonly-notice').hidden=state!=='readonly';byId('add').hidden=state==='readonly'||!!message;byId('save-status').textContent=state==='save-error'?'自动保存失败，内容保留；真实行为沿用任务接口':state==='submitted'?'提交成功（仅反馈示意，不改变已确认的任务状态机）':state==='readonly'?'只读查看':'草稿将实时保存到云端（文案示意，不会真实保存）';byId('current-tab').setAttribute('aria-selected',String(!reference));byId('reference-tab').setAttribute('aria-selected',String(reference));}
byId('state').addEventListener('change',()=>{count=byId('state').value==='partial'?2:1;reference=false;render();});byId('add').onclick=()=>{count++;render();};byId('retry').onclick=()=>{byId('state').value='edit';render();};byId('current-tab').onclick=()=>{reference=false;render();};byId('reference-tab').onclick=()=>{reference=true;render();};byId('cancel').onclick=()=>{byId('save-status').textContent='正式页面沿原任务上下文返回；蓝图不执行导航。';};render();
</script></body></html>
