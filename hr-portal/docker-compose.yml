services:
  db:
    image: postgres:15-alpine
    container_name: hr-portal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hr_portal}
      POSTGRES_USER: ${DB_USER:-hr_portal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${DB_PUBLIC_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hr_portal} -d ${DB_NAME:-hr_portal}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: hr-portal-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-prod}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DB_HOST: db
      DB_BIND_HOST: ${DB_BIND_HOST:-127.0.0.1}
      DB_PUBLIC_HOST: ${DB_PUBLIC_HOST:-}
      DB_PUBLIC_PORT: ${DB_PUBLIC_PORT:-5432}
      DB_READONLY_CONNECTION_LIMIT: ${DB_READONLY_CONNECTION_LIMIT:-5}
      DB_READONLY_STATEMENT_TIMEOUT_SECONDS: ${DB_READONLY_STATEMENT_TIMEOUT_SECONDS:-60}
      DB_READONLY_IDLE_TRANSACTION_TIMEOUT_SECONDS: ${DB_READONLY_IDLE_TRANSACTION_TIMEOUT_SECONDS:-60}
      PG_HBA_MANAGED_FILE: /app/pg_hba.conf
      DB_NAME: ${DB_NAME:-hr_portal}
      DB_USER: ${DB_USER:-hr_portal}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-please-change-in-env}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-admin123}
      SECRET_BOX_KEY: ${SECRET_BOX_KEY:-}
      BEISEN_BASE_URL: ${BEISEN_BASE_URL:-}
      BEISEN_APP_KEY: ${BEISEN_APP_KEY:-}
      BEISEN_APP_SECRET: ${BEISEN_APP_SECRET:-}
      ORG_ROOT_NAME: ${ORG_ROOT_NAME:-创梦天地}
      COST_ALLOCATION_APP_URL: ${COST_ALLOCATION_APP_URL:-http://192.168.10.13:37800/}
      COST_ALLOCATION_ADMIN_PATH: ${COST_ALLOCATION_ADMIN_PATH:-/admin/workbench}
      FEISHU_SSO_ENABLED: ${FEISHU_SSO_ENABLED:-false}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_CALLBACK_MAX_TIMESTAMP_DIFF: ${FEISHU_CALLBACK_MAX_TIMESTAMP_DIFF:-300}
      FEISHU_BOT_ENABLED: ${FEISHU_BOT_ENABLED:-false}
      FEISHU_EMPLOYEE_PROFILE_ENABLED: ${FEISHU_EMPLOYEE_PROFILE_ENABLED:-false}
      FEISHU_EMPLOYEE_PROFILE_ALLOWED_USER_IDS: ${FEISHU_EMPLOYEE_PROFILE_ALLOWED_USER_IDS:-}
      EMPLOYEE_PROFILE_ENABLED: ${EMPLOYEE_PROFILE_ENABLED:-false}
      EMPLOYEE_PROFILE_ALLOWED_USER_IDS: ${EMPLOYEE_PROFILE_ALLOWED_USER_IDS:-}
      EMPLOYEE_PROFILE_EXPIRES_AT: ${EMPLOYEE_PROFILE_EXPIRES_AT:-}
      AI_CAPABILITY_RATE_LIMIT_MAX_REQUESTS: ${AI_CAPABILITY_RATE_LIMIT_MAX_REQUESTS:-20}
      AI_CAPABILITY_RATE_LIMIT_WINDOW_SECONDS: ${AI_CAPABILITY_RATE_LIMIT_WINDOW_SECONDS:-300}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      WAREHOUSE_FEATURE_ODS_DWD_AUTOMATION: ${WAREHOUSE_FEATURE_ODS_DWD_AUTOMATION:-false}
      WAREHOUSE_FEATURE_METRIC_AUTOMATION: ${WAREHOUSE_FEATURE_METRIC_AUTOMATION:-true}

    volumes:
      - ./backend:/app:cached
      - ./data/pg/pg_hba.conf:/app/pg_hba.conf:rw
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      - ./backend/docker/fonts:/usr/share/fonts/truetype/custom:ro

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: hr-portal-gotenberg
    restart: unless-stopped
    volumes:
      - ./backend/docker/fonts:/usr/share/fonts/truetype/custom:ro
    command:
      - "gotenberg"
      - "--api-timeout=120s"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_COST_ALLOCATION_APP_URL: ${VITE_COST_ALLOCATION_APP_URL:-}
        VITE_COST_ALLOCATION_ADMIN_URL: ${VITE_COST_ALLOCATION_ADMIN_URL:-}
    container_name: hr-portal-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
